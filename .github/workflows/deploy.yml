name: Deploy to WordPress.org
on:
  # Trigger on the tag, not the release: release.yml publishes the release with
  # GITHUB_TOKEN, and events raised by that token don't start other workflows.
  push:
    tags:
      - '*'
      - '!*-*' # Skip pre-releases (1.2.3-beta1). Negative patterns must follow the positive one.
  # Allow manual triggering of the workflow.
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: New release to WordPress.org
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SVN (Subversion)
        run: |
          sudo apt-get update
          sudo apt-get install subversion

      - name: Push to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SLUG: rewrite-rules-inspector
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
